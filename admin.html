<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Owlpost 学籍登记 - 管理后台</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/owl.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ===== Login View ===== -->
    <div id="loginView">
        <div class="container">
            <header class="page-header">
                <span class="owl-icon">🦉</span>
                <h1>管理后台</h1>
                <p class="subtitle">Owlpost · 学籍登记管理系统</p>
            </header>

            <div class="card login-card">
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" class="form-input" id="adminUsername" placeholder="输入管理员用户名" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" class="form-input" id="adminPassword" placeholder="输入管理密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <span id="loginText">🔑 登录</span>
                        <span id="loginSpinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== Dashboard View ===== -->
    <div id="dashboardView" style="display:none;">
        <div class="container-wide">
            <header class="page-header">
                <span class="owl-icon">🦉</span>
                <h1>学籍管理后台</h1>
                <p class="subtitle">实时查看注册用户与订阅状态</p>
            </header>

            <!-- Stats -->
            <div class="stats-row" id="statsRow">
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">-</div>
                    <div class="stat-label">总注册</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statActive">-</div>
                    <div class="stat-label">正式用户</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statTrial">-</div>
                    <div class="stat-label">试用中</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statExpired">-</div>
                    <div class="stat-label">已过期</div>
                </div>
            </div>

            <!-- Search & Actions -->
            <div class="search-bar">
                <input type="text" class="form-input" id="searchInput" placeholder="🔍 搜索昵称 / QQ号 / UID ...">
                <button class="btn btn-secondary" id="dupCheckBtn">🔍 一键查重</button>
                <button class="btn btn-secondary" id="refreshBtn">🔄 刷新数据</button>
            </div>

            <!-- Data Area -->
            <div id="dataArea">
                <div class="loading-overlay" id="loadingArea">
                    <span class="spinner"></span>
                    <span>正在加载数据...</span>
                </div>
            </div>

            <!-- Footer -->
            <footer class="page-footer">
                Owlpost · 管理后台
            </footer>
        </div>
    </div>

    <!-- ===== Edit Modal ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>✏️ 编辑记录</h3>
                <button class="btn btn-icon modal-close" id="editModalClose">✕</button>
            </div>
            <form id="editForm" autocomplete="off">
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" class="form-input" id="editNickname" required maxlength="50">
                </div>
                <div class="form-group">
                    <label>QQ号</label>
                    <input type="text" class="form-input" id="editQqNumber" required pattern="[0-9]+"
                           inputmode="numeric" maxlength="15">
                </div>
                <div class="form-group">
                    <label>用户UID</label>
                    <div class="uid-list" id="editUidList"></div>
                    <button type="button" class="btn btn-add" id="editAddUidBtn">＋ 添加更多UID</button>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="editCancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary modal-submit-btn" id="editSaveBtn">
                        <span id="editSaveText">💾 保存</span>
                        <span id="editSaveSpinner" class="spinner" style="display:none;"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Delete Confirm Modal ===== -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-card modal-card-sm">
            <div class="modal-header">
                <h3>⚠️ 确认删除</h3>
                <button class="btn btn-icon modal-close" id="deleteModalClose">✕</button>
            </div>
            <p class="modal-body-text">确定要删除 <strong id="deleteTargetName"></strong> 的登记记录吗？此操作无法撤销。</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="deleteCancelBtn">取消</button>
                <button type="button" class="btn btn-danger" id="deleteConfirmBtn">
                    <span id="deleteConfirmText">🗑️ 确认删除</span>
                    <span id="deleteConfirmSpinner" class="spinner" style="display:none;"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
